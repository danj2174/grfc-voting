<style>

    --dark: #141414;

  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body { background: var(--black); color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100vh; overflow-x: hidden; }

  /* HEADER */
  header { background: linear-gradient(135deg, #0d0d0d 0%, #1a1200 100%); border-bottom: 3px solid var(--gold); position: sticky; top: 0; z-index: 100; }
  .header-inner { max-width: 960px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-text { line-height: 1; }
  .logo-text h1 { font-size: clamp(18px, 4vw, 24px); color: var(--gold); text-shadow: 0 0 20px #f5c80066; }
  .logo-text span { font-size: 10px; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; font-family: 'Barlow', sans-serif; }
  nav { display: flex; gap: 2px; flex-wrap: wrap; }
  .nav-btn { background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; padding: 6px 14px; transition: all 0.15s; }
  .nav-btn:hover, .nav-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

  /* MAIN */
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 60px; }

  /* CARDS */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 20px; }
  .card-gold { border-color: var(--gold-dim); }
  .card-highlight { background: linear-gradient(135deg, #1a1200 0%, #181818 100%); border-color: #f5c80055; }

  /* BUTTONS */
  .btn { cursor: pointer; border: none; font-family: 'Oswald', sans-serif; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; transition: all 0.15s; border-radius: 3px; display: inline-flex; align-items: center; gap: 6px; }
  .btn-gold { background: var(--gold); color: var(--black); padding: 10px 22px; font-size: 14px; }
  .btn-gold:hover { background: #ffe040; transform: translateY(-1px); box-shadow: 0 4px 18px #f5c80055; }
  .btn-dark { background: #1e1e1e; color: var(--gold); border: 1px solid #f5c80066; padding: 8px 16px; font-size: 13px; }
  .btn-dark:hover { background: var(--gold); color: var(--black); }
  .btn-red { background: var(--red); color: white; padding: 6px 13px; font-size: 12px; }
  .btn-red:hover { background: #e74c3c; }
  .btn-green { background: var(--green); color: white; padding: 7px 14px; font-size: 12px; }
  .btn-green:hover { background: #27ae60; }
  .btn-sm { padding: 5px 11px !important; font-size: 11px !important; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

  /* INPUTS */
  .input { background: #1c1c1c; border: 1px solid #333; color: var(--text); padding: 9px 13px; border-radius: 3px; font-family: 'Barlow', sans-serif; font-size: 14px; width: 100%; outline: none; transition: border 0.15s; }
  .input:focus { border-color: var(--gold); }
  select.input option { background: #1c1c1c; }

  /* TAGS */
  .tag { display: inline-block; padding: 3px 9px; border-radius: 2px; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-family: 'Oswald', sans-serif; }
  .tag-open { background: var(--green); color: white; }
  .tag-closed { background: #444; color: #aaa; }
  .tag-results { background: var(--gold); color: var(--black); }

  /* SECTION TITLE */
  .sec { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; font-family: 'Oswald', sans-serif; }

  /* PLAYER GRID */
  .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; }
  .player-btn { background: #1a1a1a; border: 2px solid #333; color: #ccc; padding: 8px 10px; border-radius: 4px; cursor: pointer; transition: all 0.12s; font-family: 'Barlow', sans-serif; font-size: 13px; text-align: left; width: 100%; }
  .player-btn:hover { border-color: var(--gold); color: var(--gold); }
  .player-btn.p1 { border-color: var(--gold); background: #2a220099; color: var(--gold); }
  .player-btn.p2 { border-color: var(--silver); background: #22222299; color: var(--silver); }
  .player-btn.p3 { border-color: var(--bronze); background: #1e150099; color: var(--bronze); }

  /* PICK SLOTS */
  .pick-slots { display: grid; gap: 8px; margin-bottom: 20px; }
  .pick-slot { border: 2px dashed #2e2e2e; border-radius: 4px; padding: 11px 14px; display: flex; align-items: center; justify-content: space-between; min-height: 46px; transition: border-color 0.15s; }
  .pick-slot.s1 { border-color: var(--gold); background: #2a220033; }
  .pick-slot.s2 { border-color: var(--silver); background: #22222233; }
  .pick-slot.s3 { border-color: var(--bronze); background: #1e150033; }
  .pick-slot-label { font-size: 13px; color: #555; }
  .pick-slot.filled .pick-slot-label { color: var(--text); }

  /* RANK BADGES */
  .rank { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 15px; flex-shrink: 0; }

  .rank-4 { background: #222; color: #777; border: 1px solid #333; }
  .rank-5 { background: #1a1a1a; color: #555; border: 1px solid #2a2a2a; }

  /* TABLES */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #161616; color: var(--gold); padding: 9px 12px; text-align: left; font-size: 11px; letter-spacing: 1px; border-bottom: 2px solid var(--gold); font-family: 'Oswald', sans-serif; }
  td { padding: 8px 12px; border-bottom: 1px solid #1e1e1e; color: #bbb; }
  tr:hover td { background: #161616; }

  /* MISC */
  .err { color: #e74c3c; font-size: 13px; padding: 6px 0; }
  .success-icon { font-size: 52px; display: block; text-align: center; margin-bottom: 12px; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .flex-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .spacer { margin-top: 16px; }
  .loading { color: var(--muted); font-size: 14px; padding: 20px 0; text-align: center; }

  /* SPINNER */
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #333; border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* TOAST */
  #toast { position: fixed; bottom: 24px; right: 24px; background: var(--gold); color: var(--black); font-family: 'Oswald', sans-serif; font-weight: 600; letter-spacing: 1px; padding: 12px 22px; border-radius: 4px; font-size: 14px; transform: translateY(80px); opacity: 0; transition: all 0.3s; z-index: 999; pointer-events: none; }
  #toast.show { transform: translateY(0); opacity: 1; }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .grid-2 { grid-template-columns: 1fr; }
    .hide-sm { display: none !important; }
    .player-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }

  /* PAGE TRANSITIONS */
  .page { animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* HERO STRIPE */
  .hero-stripe { background: repeating-linear-gradient(45deg, transparent, transparent 8px, #f5c8000a 8px, #f5c8000a 16px); }
</style>

<script>
// ── Supabase ─────────────────────────────────────────────────────────────────
const SUPA_URL = "https://nykoxcohnrabdqnchiga.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55a294Y29obnJhYmRxbmNoaWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjAwMjQsImV4cCI6MjA5Mzc5NjAyNH0.G6RPpQXXH-PCXiONzo6EGcWV3v9DpFRzKdqfd7KH55o";
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

// ── Players ───────────────────────────────────────────────────────────────────
const PLAYERS = [
  {id:1,first:"Aaron",last:"Jenkins"},{id:2,first:"Alan",last:"Cheek"},
  {id:3,first:"Brett",last:"Pritchard"},{id:4,first:"Christopher",last:"Sjoblom"},
  {id:5,first:"Dale",last:"Graham"},{id:6,first:"Daniel",last:"Johnston"},
  {id:7,first:"Garrett",last:"Nelson"},{id:8,first:"Graham",last:"Southgate"},
  {id:9,first:"Jason",last:"Cain"},{id:10,first:"Jason",last:"Owen"},
  {id:11,first:"Jason",last:"Ponder"},{id:12,first:"Jon",last:"Hancock"},
  {id:13,first:"Keiran",last:"Williams"},{id:14,first:"Mark",last:"Worland"},
  {id:15,first:"Matt",last:"Jones"},{id:16,first:"Michael",last:"Goddard"},
  {id:17,first:"Mike",last:"Jorge"},{id:18,first:"Nathan",last:"Johnson"},
  {id:19,first:"Paul",last:"West"},{id:20,first:"Riyaz",last:"Jordan"},
  {id:21,first:"Serge",last:"Hrouda"},{id:22,first:"Shamus",last:"Toomey"},
  {id:23,first:"Simon",last:"Fisher"},{id:24,first:"Stephen",last:"Jones"},
  {id:25,first:"Stuart",last:"Cullen"},{id:26,first:"Troy",last:"Dalton"},
];
const pName = id => { const p = PLAYERS.find(x=>x.id===id); return p ? `${p.first} ${p.last}` : "?"; };

// ── State ─────────────────────────────────────────────────────────────────────
const ADMIN_PW = "GRFC2024";
let state = {
  view: "home",
  adminLoggedIn: false,
  adminTab: "matches",
  detailMatchId: null,
  matches: [],
  votes: [],           // all votes (admin only)
  voterPlayerId: null,
  voterFirst: "",
  voterLast: "",
  voterStep: 1,        // 1=identify, 2=pick
  picks: [null,null,null],
  voteSubmitted: false,
  voteError: "",
  newLabel: "",
  newDate: "",
  adminPw: "",
  adminPwError: false,
  resultsMatchId: null,
  loading: false,
  matchVotes: [],
  selectedExportMatchId: null,
};

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
}

// ── DB helpers ────────────────────────────────────────────────────────────────
async function loadMatches() {
  const { data } = await sb.from("matches").select("*").order("id", { ascending: false });
  return data || [];
}
async function loadVotes(matchId) {
  const q = sb.from("votes").select("*");
  if (matchId) q.eq("match_id", matchId);
  const { data } = await q;
  return data || [];
}
async function createMatch(label, date) {
  // close open ones first
  await sb.from("matches").update({ status: "closed" }).eq("status", "open");
  await sb.from("matches").insert({ label, date, status: "open" });
}
async function setMatchStatus(id, status) {
  if (status === "open") await sb.from("matches").update({ status: "closed" }).eq("status", "open");
  await sb.from("matches").update({ status }).eq("id", id);
}
async function deleteMatch(id) {
  await sb.from("votes").delete().eq("match_id", id);
  await sb.from("matches").delete().eq("id", id);
}
async function submitVoteDB(matchId, first, last, p1, p2, p3) {
  const { error } = await sb.from("votes").insert({
    match_id: matchId, voter_first: first, voter_last: last,
    pick1_player_id: p1, pick2_player_id: p2, pick3_player_id: p3
  });
  return error;
}
async function hasVoted(matchId, first, last) {
  const { data } = await sb.from("votes").select("id")
    .eq("match_id", matchId)
    .ilike("voter_first", first).ilike("voter_last", last);
  return data && data.length > 0;
}

// ── Score calculation (prorated) ──────────────────────────────────────────────
function computeScores(votes) {
  const raw = {};
  PLAYERS.forEach(p => raw[p.id] = 0);
  votes.forEach(v => {
    if (v.pick1_player_id) raw[v.pick1_player_id] = (raw[v.pick1_player_id]||0) + 3;
    if (v.pick2_player_id) raw[v.pick2_player_id] = (raw[v.pick2_player_id]||0) + 2;
    if (v.pick3_player_id) raw[v.pick3_player_id] = (raw[v.pick3_player_id]||0) + 1;
  });
  // Prorate so total points always = 26 players x 6 points = 156
  const TOTAL_POINTS = 156;
  const sumRaw = Object.values(raw).reduce((a,b)=>a+b,0);
  const factor = sumRaw > 0 ? TOTAL_POINTS / sumRaw : 0;
  const pro = {};
  Object.keys(raw).forEach(id => pro[id] = raw[id] * factor);
  return { raw, pro };
}

// ── CSV Export ────────────────────────────────────────────────────────────────
async function exportCSV() {
  const matches = await loadMatches();
  const allVotes = await loadVotes();
  const rows = [["Match","Date","Status","Voter First","Voter Last","1st Pick (3pts)","2nd Pick (2pts)","3rd Pick (1pt)","Total Voters in Match"]];
  for (const m of matches) {
    const mv = allVotes.filter(v => v.match_id === m.id);
    if (mv.length === 0) { rows.push([m.label, m.date, m.status, "(no votes)","","","","",0]); continue; }
    mv.forEach(v => rows.push([
      m.label, m.date, m.status, v.voter_first, v.voter_last,
      v.pick1_player_id ? pName(v.pick1_player_id) : "",
      v.pick2_player_id ? pName(v.pick2_player_id) : "",
      v.pick3_player_id ? pName(v.pick3_player_id) : "",
      mv.length
    ]));
  }
  const csv = rows.map(r => r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv],{type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download="GRFC_O45_D2_Votes.csv"; a.click();
  URL.revokeObjectURL(url);
}

function doExportPlayerTotals() {
  if (!state.selectedExportMatchId) { toast("⚠️ Please select a match first."); return; }
  const m = state.matches.find(x => x.id === state.selectedExportMatchId);
  if (!m) { toast("⚠️ Match not found."); return; }
  exportPlayerTotals(m);
}

async function exportPlayerTotals(match) {
  const TOTAL_POINTS = 156;
  const mv = await loadVotes(match.id);

  // Raw scores for this match
  const raw = {};
  PLAYERS.forEach(p => { raw[p.id] = 0; });
  mv.forEach(v => {
    if (v.pick1_player_id) raw[v.pick1_player_id] = (raw[v.pick1_player_id]||0) + 3;
    if (v.pick2_player_id) raw[v.pick2_player_id] = (raw[v.pick2_player_id]||0) + 2;
    if (v.pick3_player_id) raw[v.pick3_player_id] = (raw[v.pick3_player_id]||0) + 1;
  });
  const sumRaw = Object.values(raw).reduce((a,b)=>a+b,0);
  const factor = sumRaw > 0 ? TOTAL_POINTS / sumRaw : 0;
  const pro = {};
  PLAYERS.forEach(p => { pro[p.id] = raw[p.id] * factor; });

  // Sort by prorated score desc
  const sorted = PLAYERS.map(p => ({ p, score: pro[p.id] })).sort((a,b) => b.score - a.score);

  const rows = [["Rank", "First Name", "Last Name", "Prorated Points", "Raw Points", "Voters in Match"]];
  sorted.forEach((item, i) => {
    rows.push([
      i + 1,
      item.p.first,
      item.p.last,
      item.score.toFixed(3),
      raw[item.p.id],
      mv.length
    ]);
  });

  const filename = `GRFC_O45_D2_Player_Totals_${match.label.replace(/[^a-z0-9]/gi,'_')}.csv`;
  const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

// ── Navigate ──────────────────────────────────────────────────────────────────
async function navigate(view, opts={}) {
  state.view = view;
  state.loading = true;
  render();
  if (view === "home" || view === "vote" || view === "results") {
    state.matches = await loadMatches();
  }
  if (view === "admin" && state.adminLoggedIn) {
    state.matches = await loadMatches();
    if (state.adminTab === "detail" && state.detailMatchId) {
      state.votes = await loadVotes(state.detailMatchId);
    } else if (state.adminTab === "summary") {
      state.votes = await loadVotes();
    }
  }
  if (view === "vote") {
    state.voteSubmitted = false; state.voteError = "";
    state.picks = [null,null,null]; state.voterStep = 1;
    state.voterPlayerId = null; state.voterFirst = ""; state.voterLast = "";
    // Load existing votes so we can hide players who already voted
    const om = state.matches.find(m => m.status === "open");
    if (om) { const vdata = await loadVotes(om.id); state.matchVotes = vdata; }
    else { state.matchVotes = []; }
  }
  if (opts.resultsMatchId !== undefined) state.resultsMatchId = opts.resultsMatchId;
  state.loading = false;
  render();
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  renderNav();
  const app = document.getElementById("app");
  if (state.loading) { app.innerHTML = `<div class="loading"><span class="spinner"></span> Loading...</div>`; return; }

  const openMatch = state.matches.find(m => m.status === "open");
  const resultMatches = state.matches.filter(m => m.status === "results");

  if (state.view === "home") app.innerHTML = renderHome(openMatch, resultMatches);
  else if (state.view === "vote") app.innerHTML = renderVote(openMatch);
  else if (state.view === "results") app.innerHTML = renderResults(resultMatches);
  else if (state.view === "admin") app.innerHTML = renderAdmin(openMatch);

  bindEvents();
}

function renderNav() {
  const nav = document.getElementById("nav");
  const openMatch = state.matches.find(m => m.status === "open");

// ── VOTE ──────────────────────────────────────────────────────────────────────
function renderVote(openMatch) {
  if (!openMatch) return `<div class="page card" style="color:var(--muted);">No match is currently open for voting.</div>`;

  if (state.voteSubmitted) return `<div class="page card card-gold" style="text-align:center;padding:40px;max-width:480px;margin:40px auto;">
    <span class="success-icon">🐯</span>
    <h3 style="color:var(--gold);font-size:24px;margin-bottom:10px;">Vote Submitted!</h3>
    <p style="color:var(--muted);margin-bottom:22px;">Your vote for <strong style="color:var(--gold);">${openMatch.label}</strong> has been recorded.</p>
    <button class="btn btn-dark" onclick="navigate('home')">Back to Home</button>
  </div>`;

  let html = `<div class="page">
  <h2 style="color:var(--gold);font-size:26px;margin-bottom:16px;letter-spacing:2px;">Cast Your Vote</h2>
  <div class="card card-highlight flex-row" style="margin-bottom:16px;gap:14px;">
    <div>
      <div style="color:var(--gold);font-weight:600;font-size:17px;">${openMatch.label}</div>
      <div style="color:var(--muted);font-size:13px;">${openMatch.date}</div>
    </div>
  </div>`;

  // Step 1: identify
  if (state.voterStep === 1) {
    html += `<div class="card" style="max-width:480px;">
      <div class="sec">Step 1 of 2 · Who are you?</div>
      <p style="color:var(--muted);font-size:13px;margin-bottom:16px;">Select your name to prevent duplicate votes.</p>
      <select class="input" id="voterSelect" style="margin-bottom:14px;" onchange="onVoterSelect(this.value)">
        <option value="">— Select your name —</option>
        ${PLAYERS.filter(p => !(state.matchVotes||[]).some(v => v.voter_first.toLowerCase()===p.first.toLowerCase() && v.voter_last.toLowerCase()===p.last.toLowerCase())).map(p=>`<option value="${p.id}" ${state.voterPlayerId===p.id?'selected':''}>${p.first} ${p.last}</option>`).join('')}
      </select>
      <div id="voterNextArea"></div>
    </div>`;
  }

  // Step 2: pick
  if (state.voterStep === 2) {
    const eligible = PLAYERS.filter(p => p.id !== state.voterPlayerId);
    const slotLabels = ["🥇 1st — 3 Points","🥈 2nd — 2 Points","🥉 3rd — 1 Point"];
    const slotCls = ["s1","s2","s3"];

    html += `<div class="sec">Step 2 of 2 · Select your top 3 performers</div>
    <div class="pick-slots">`;
    [0,1,2].forEach(i => {
      const filled = state.picks[i] !== null;
      html += `<div class="pick-slot ${filled ? slotCls[i]+' filled' : ''}">
        <span class="pick-slot-label">${slotLabels[i]}${filled ? ': '+pName(state.picks[i]) : ''}</span>
        ${filled ? `<button class="btn btn-dark btn-sm" onclick="clearPick(${i})">✕</button>` : ''}
      </div>`;
    });
    html += `</div>`;

    if (state.voteError) html += `<div class="err">${state.voteError}</div>`;

    html += `<div class="sec">Click a player to assign to next available slot:</div>
    <div class="player-grid" style="margin-bottom:20px;">`;
    eligible.forEach(p => {
      const idx = state.picks.indexOf(p.id);
      const cls = idx===0?'p1':idx===1?'p2':idx===2?'p3':'';
      const badge = idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':'';
      html += `<button class="player-btn ${cls}" onclick="togglePick(${p.id})">${badge?badge+' ':''}${p.first} ${p.last}</button>`;
    });
    html += `</div>
    <div class="flex-row">
      <button class="btn btn-gold" style="font-size:15px;padding:12px 28px;" onclick="doSubmitVote(${openMatch.id})">Submit Vote</button>
      <button class="btn btn-dark" onclick="state.voterStep=1;render()">← Back</button>
    </div>`;
  }

  html += `</div>`;
  return html;
}

// ── RESULTS ───────────────────────────────────────────────────────────────────
function renderResults(resultMatches) {
  let html = `<div class="page"><h2 style="color:var(--gold);font-size:26px;margin-bottom:16px;letter-spacing:2px;">Match Results</h2>`;
  if (!resultMatches.length) return html + `<div class="card" style="color:var(--muted);">No results posted yet.</div></div>`;

  html += `<div class="flex-row" style="margin-bottom:20px;">`;
  resultMatches.forEach(m => {
    html += `<button class="btn ${state.resultsMatchId===m.id?'btn-gold':'btn-dark'}" onclick="showResults(${m.id})">${m.label}</button>`;
  });
  html += `</div>`;

  if (state.resultsMatchId) {
    html += `<div id="results-content"><div class="loading"><span class="spinner"></span></div></div>`;
  }

  html += `</div>`;
  return html;
}

async function showResults(matchId) {
  state.resultsMatchId = matchId;
  render();
  const el = document.getElementById("results-content");
  if (!el) return;
  const votes = await loadVotes(matchId);
  const m = state.matches.find(x=>x.id===matchId);
  const { pro } = computeScores(votes);
  const top5 = Object.entries(pro).map(([id,score])=>({id:parseInt(id),score}))
    .sort((a,b)=>b.score-a.score).slice(0,5).filter(x=>x.score>0);
  const ordinals = ["1st","2nd","3rd","4th","5th"];
  let html = `<div class="card card-gold" style="max-width:520px;">
    <div style="border-bottom:1px solid var(--gold-dim);padding-bottom:14px;margin-bottom:18px;">
      <h3 style="color:var(--gold);font-size:20px;">${m.label}</h3>
      <div style="color:var(--muted);font-size:13px;">${m.date} · ${votes.length} vote${votes.length!==1?'s':''} cast</div>
    </div>
    <div style="display:grid;gap:14px;">`;
  top5.forEach((entry,i) => {
    html += `<div style="display:flex;align-items:center;gap:14px;">
      <div class="rank rank-${i+1}">${i+1}</div>
      <div>
        <div style="font-family:'Oswald',sans-serif;font-weight:600;font-size:18px;color:${i===0?'var(--gold)':'var(--text)'};">${pName(entry.id)}</div>
        <div style="font-size:12px;color:var(--muted);">${ordinals[i]} Place</div>
      </div>
    </div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;
}

// ── Event handlers ────────────────────────────────────────────────────────────
function bindEvents() {
  // auto-check voter step 1 area after render
  if (state.view === "vote" && state.voterStep === 1 && state.voterPlayerId) {
    const area = document.getElementById("voterNextArea");
    if (area) renderVoterNextArea(area);
  }
}

async function onVoterSelect(val) {
  if (!val) { state.voterPlayerId = null; state.voterFirst = ""; state.voterLast = ""; }
  else {
    const id = parseInt(val);
    const p = PLAYERS.find(x=>x.id===id);
    state.voterPlayerId = id; state.voterFirst = p.first; state.voterLast = p.last;
  }
  const area = document.getElementById("voterNextArea");
  if (area && state.voterPlayerId) renderVoterNextArea(area);
}

async function renderVoterNextArea(area) {
  area.innerHTML = `<div class="loading" style="padding:8px 0;text-align:left;"><span class="spinner"></span> Checking...</div>`;
  const openMatch = state.matches.find(m=>m.status==="open");
  if (!openMatch) return;
  const already = await hasVoted(openMatch.id, state.voterFirst, state.voterLast);
  if (already) {
    area.innerHTML = `<div class="err">You have already voted for this match.</div>`;
  } else {
    area.innerHTML = `<button class="btn btn-gold" onclick="state.voterStep=2;render()">Continue →</button>`;
  }
}

function togglePick(playerId) {
  const idx = state.picks.indexOf(playerId);
  if (idx >= 0) { state.picks[idx] = null; }
  else {
    const next = state.picks.indexOf(null);
    if (next === -1) return;
    state.picks[next] = playerId;
  }
  render();
}

function clearPick(i) { state.picks[i] = null; render(); }

async function doSubmitVote(matchId) {
  if (state.picks.some(p=>p===null)) { state.voteError = "Please select all three picks."; render(); return; }
  if (new Set(state.picks).size < 3) { state.voteError = "Each pick must be a different player."; render(); return; }
  const btn = document.querySelector(".btn-gold[onclick^='doSubmitVote']");
  if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Submitting...`; }
  const err = await submitVoteDB(matchId, state.voterFirst, state.voterLast, state.picks[0], state.picks[1], state.picks[2]);
  if (err) { state.voteError = "Error submitting vote. Please try again."; render(); return; }
  state.voteSubmitted = true; render();
}

function doAdminLogin() {
  if (state.adminPw === ADMIN_PW) { state.adminLoggedIn = true; state.adminPwError = false; navigate("admin"); }
  else { state.adminPwError = true; state.adminPw = ""; render(); }
}
function doAdminLogout() { state.adminLoggedIn = false; navigate("home"); }
function setAdminTab(tab) { state.adminTab = tab; state.detailMatchId = null; navigate("admin"); }

async function doCreateMatch() {
  // Always read live from DOM first, fall back to state
  const labelEl = document.getElementById("newLabel");
  const dateEl = document.getElementById("newDate");
  const label = (labelEl?.value || state.newLabel || "").trim();
  const date = dateEl?.value || state.newDate || "";
  if (!label) { toast("⚠️ Please enter a match label."); return; }
  if (!date) { toast("⚠️ Please select a date."); return; }
  // Disable button to prevent double-submit
  const btn = document.querySelector("[onclick='doCreateMatch()']");
  if (btn) { btn.disabled = true; btn.textContent = "Creating..."; }
  const { error } = await sb.from("matches").select("id").limit(1); // connectivity check
  if (error) { toast("❌ Cannot reach database: " + error.message); if (btn) { btn.disabled=false; btn.textContent="+ Create & Open"; } return; }
  // Close any open matches
  const { error: closeErr } = await sb.from("matches").update({ status: "closed" }).eq("status", "open");
  if (closeErr) console.warn("Close error:", closeErr.message);
  // Insert new match
  const { error: insertErr } = await sb.from("matches").insert({ label, date, status: "open" });
  if (insertErr) {
    toast("❌ Error: " + insertErr.message);
    const rlsB = document.getElementById("rls-banner"); if (rlsB) rlsB.style.display="block";
    if (btn) { btn.disabled=false; btn.textContent="+ Create & Open"; }
    return;
  }
  state.newLabel = ""; state.newDate = "";
  toast("✅ Match created and opened!");
  navigate("admin");
}

async function doSetStatus(id, status) {
  if (status === "open") {
    const { error: e } = await sb.from("matches").update({ status: "closed" }).eq("status", "open");
    if (e) { toast("Error: " + e.message); return; }
  }
  const { error } = await sb.from("matches").update({ status }).eq("id", id);
  if (error) { toast("Error: " + error.message); return; }
  toast("Done: match " + status + "!");
  navigate("admin");
}

async function doDeleteMatch(id) {
  if (!confirm("Delete this match and all its votes? This cannot be undone.")) return;
  const { error: e1 } = await sb.from("votes").delete().eq("match_id", id);
  if (e1) { toast("Error: " + e1.message); return; }
  const { error: e2 } = await sb.from("matches").delete().eq("id", id);
  if (e2) { toast("Error: " + e2.message); return; }
  toast("Match deleted.");
  navigate("admin");
}

async function openDetail(id) {
  state.detailMatchId = id;
  state.adminTab = "matches";
  state.loading = true; render();
  state.votes = await loadVotes(id);
  state.loading = false; render();
}

function closeDetail() { state.detailMatchId = null; navigate("admin"); }

// ── Init ──────────────────────────────────────────────────────────────────────
navigate("home");
</script>
